name: Forex PRZ Auto Checker

# on:
#   schedule:
#     # Berjalan setiap 5 menit menggunakan cron syntax
#     - cron: '*/5 * * * *'
#   # Memungkinkan Anda menjalankan skrip secara manual dari tab Actions di GitHub
#   workflow_dispatch:
on:
  push:
    branches:
      - master
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  
jobs:
  run-checker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PRZ Checker Script
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          SPREADSHEET_NAME: ${{ secrets.SPREADSHEET_NAME }}
        run: |
          python main.py
